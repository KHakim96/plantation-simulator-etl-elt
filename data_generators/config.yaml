# =============================================================================
# Master configuration for plantation source-data generators (Phase 1).
#
# Every key below is consumed by the existing generator code. Keys were derived
# by inspecting data_generators/*.py — do not rename sections without updating
# the generators.
#
# Cost / trial note: volumes are intentionally modest (see AGENTS.md §7). The
# generation window is a single quarter so the full batch produces small CSVs
# suitable for an Azure trial / portfolio demo.
# =============================================================================

global_settings:
  random_seed: 42
  generation_period:
    # Short window keeps total row counts small for trial/portfolio use.
    start_date: "2024-01-01"
    end_date: "2024-03-31"

output_settings:
  # Local simulation scratch only. upload_to_adls.py reads from these paths and
  # delivers to ADLS Landing. Never commit generated CSVs (see .gitignore).
  output_paths:
    weather: "data/raw/weather"
    harvest: "data/raw/harvest"
    fertilizer: "data/raw/fertilizer"
    equipment: "data/raw/equipment"
    hr: "data/raw/hr"
    finance: "data/raw/finance"
    sensors: "data/raw/sensors"      # Phase 7 only — not used by the Phase 1 batch

# Target row counts per dataset. Modest sizes for an Azure trial.
# NOTE on hr: the HR generator emits at most one record per (employee, calendar
# day) and skips most weekends, so its output is structurally capped at
# 24 employees x 91 days = 2,184 rows for this window. The target below is
# therefore a reachable value; do NOT raise it above the calendar cap.
dataset_sizes:
  harvest: 12000
  fertilizer: 9000
  equipment: 10000
  hr: 2000
  finance: 12000
  sensors: 20000                    # Phase 7 only

generator_settings:
  weather_api:
    # Live mode is DISABLED for the batch pipeline: no API key is set and
    # fallback_to_mock is true, so the deterministic mock generator runs.
    api_key_env_var: "OPENWEATHER_API_KEY"
    endpoint: "https://api.openweathermap.org/data/2.5/weather"
    fallback_to_mock: true
  sensor_interval_minutes: 15       # Phase 7 only
  randomization:                    # Phase 7 only (sensor anomaly/missing injection)
    anomaly_rate: 0.05
    missing_data_rate: 0.01

# --- Reference / master data -------------------------------------------------

# One weather station per region. region_id links weather to blocks/cost centers.
weather_stations:
  - station_id: "STN-NORTH"
    region_id: "REG-NORTH"
    latitude: 5.6417
    longitude: 100.4894
  - station_id: "STN-CENTRAL"
    region_id: "REG-CENTRAL"
    latitude: 3.1390
    longitude: 101.6869
  - station_id: "STN-SOUTH"
    region_id: "REG-SOUTH"
    latitude: 1.4927
    longitude: 103.7414

# Crop reference data. name is the join key from blocks.crop_type.
crop_types:
  - name: "Oil Palm"
    target_yield_per_ha_ton: 22.0
    optimal_moisture_pct: [60, 85]
    optimal_temp_c: [24, 32]
  - name: "Rubber"
    target_yield_per_ha_ton: 8.0
    optimal_moisture_pct: [55, 80]
    optimal_temp_c: [23, 31]
  - name: "Tea"
    target_yield_per_ha_ton: 4.0
    optimal_moisture_pct: [50, 75]
    optimal_temp_c: [18, 26]
  - name: "Coffee"
    target_yield_per_ha_ton: 3.0
    optimal_moisture_pct: [50, 75]
    optimal_temp_c: [18, 27]

# Plantation blocks. id is referenced across harvest/fertilizer/equipment.
# Note: generate_sensors.py gives 2 sensors to BLK01/BLK05/BLK06/BLK10, so those
# IDs exist here to keep that (Phase 7) behavior meaningful.
blocks:
  - {id: "BLK01", crop_type: "Oil Palm", area_ha: 120.0, region_id: "REG-NORTH"}
  - {id: "BLK02", crop_type: "Oil Palm", area_ha: 95.0,  region_id: "REG-NORTH"}
  - {id: "BLK03", crop_type: "Rubber",   area_ha: 80.0,  region_id: "REG-NORTH"}
  - {id: "BLK04", crop_type: "Tea",      area_ha: 45.0,  region_id: "REG-CENTRAL"}
  - {id: "BLK05", crop_type: "Oil Palm", area_ha: 110.0, region_id: "REG-CENTRAL"}
  - {id: "BLK06", crop_type: "Coffee",   area_ha: 60.0,  region_id: "REG-CENTRAL"}
  - {id: "BLK07", crop_type: "Rubber",   area_ha: 75.0,  region_id: "REG-SOUTH"}
  - {id: "BLK08", crop_type: "Oil Palm", area_ha: 100.0, region_id: "REG-SOUTH"}
  - {id: "BLK09", crop_type: "Tea",      area_ha: 40.0,  region_id: "REG-SOUTH"}
  - {id: "BLK10", crop_type: "Oil Palm", area_ha: 130.0, region_id: "REG-SOUTH"}

