  - {id: "MAT02", category: "Fertilizer", standard_cost: 3.40}
  - {id: "MAT03", category: "Fertilizer", standard_cost: 2.50}
  - {id: "MAT04", category: "Fuel",       standard_cost: 1.20}
  - {id: "MAT05", category: "Pesticide",  standard_cost: 6.75}

# Cost centres, one per region. SAP finance maps region -> cost centre.
