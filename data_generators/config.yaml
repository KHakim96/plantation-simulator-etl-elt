  - {id: "CC102", region_id: "REG-CENTRAL"}
  - {id: "CC103", region_id: "REG-SOUTH"}
  - {id: "CC201", region_id: "REG-CENTRAL"}   # fleet / equipment cost centre (hard-coded in finance)

